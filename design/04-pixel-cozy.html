<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>Proposition 4 — Pixel Cozy</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: #1a1a2e; display: flex; justify-content: center; align-items: center; min-height: 100vh; }
  svg { max-width: 100%; height: auto; }
</style>
</head>
<body>
<svg viewBox="0 0 900 550" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Soft glow for pixel sprites -->
    <filter id="pixelGlow">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <!-- Scanline overlay for retro CRT feel -->
    <pattern id="scanlines" patternUnits="userSpaceOnUse" width="2" height="2">
      <rect width="2" height="1" fill="#000000" opacity="0.06"/>
    </pattern>
  </defs>

  <!-- Background: warm evening sky gradient -->
  <defs>
    <linearGradient id="skyGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2C1B47"/>
      <stop offset="30%" stop-color="#3D2B5E"/>
      <stop offset="60%" stop-color="#5E3A6B"/>
      <stop offset="100%" stop-color="#8B4A6B"/>
    </linearGradient>
    <linearGradient id="groundGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#3D2B1A"/>
      <stop offset="100%" stop-color="#2A1B0E"/>
    </linearGradient>
  </defs>

  <rect width="900" height="350" fill="url(#skyGrad)"/>
  <rect y="300" width="900" height="250" fill="url(#groundGrad)"/>

  <!-- Stars (pixel squares) -->
  <rect x="50" y="40" width="2" height="2" fill="#FFF5C2"/>
  <rect x="120" y="80" width="2" height="2" fill="#FFF5C2"/>
  <rect x="200" y="30" width="2" height="2" fill="#FFF5C2"/>
  <rect x="300" y="60" width="2" height="2" fill="#FFF5C2"/>
  <rect x="400" y="25" width="2" height="2" fill="#FFF5C2"/>
  <rect x="550" y="50" width="2" height="2" fill="#FFF5C2"/>
  <rect x="680" y="35" width="2" height="2" fill="#FFF5C2"/>
  <rect x="800" y="70" width="2" height="2" fill="#FFF5C2"/>
  <rect x="850" y="45" width="2" height="2" fill="#FFF5C2"/>
  <rect x="80" y="120" width="1.5" height="1.5" fill="#D4AF37" opacity="0.6"/>
  <rect x="350" y="100" width="1.5" height="1.5" fill="#D4AF37" opacity="0.6"/>
  <rect x="620" y="110" width="1.5" height="1.5" fill="#D4AF37" opacity="0.6"/>

  <!-- Moon -->
  <rect x="780" y="50" width="24" height="24" fill="#FFF5C2" opacity="0.9"/>
  <rect x="784" y="46" width="16" height="2" fill="#FFF5C2"/>
  <rect x="784" y="74" width="16" height="2" fill="#FFF5C2"/>
  <rect x="776" y="54" width="2" height="16" fill="#FFF5C2"/>
  <rect x="806" y="54" width="2" height="16" fill="#FFF5C2"/>
  <!-- Moon glow -->
  <circle cx="792" cy="62" r="20" fill="#FFF5C2" opacity="0.08"/>

  <!-- Distant pixel hills -->
  <rect x="0" y="270" width="200" height="40" fill="#1E2A1E"/>
  <rect x="150" y="260" width="120" height="50" fill="#252E22"/>
  <rect x="600" y="265" width="150" height="45" fill="#1E2A1E"/>
  <rect x="720" y="255" width="180" height="55" fill="#252E22"/>

  <!-- Ground horizon line -->
  <rect x="0" y="300" width="900" height="4" fill="#4A3828"/>

  <!-- ZONE 1: POTAGER (left) - isometric pixel plot -->
  <!-- Plot tile -->
  <polygon points="200,320 300,290 400,320 300,350" fill="#6B4226" stroke="#4A3018" stroke-width="2"/>
  <!-- Tile edge / side -->
  <polygon points="200,320 200,330 300,360 300,350" fill="#4A3018"/>
  <polygon points="300,350 300,360 400,330 400,320" fill="#3D2810"/>
  <!-- Pixel soil dots -->
  <rect x="240" y="308" width="3" height="3" fill="#5C3A21"/>
  <rect x="280" y="298" width="3" height="3" fill="#5C3A21"/>
  <rect x="330" y="305" width="3" height="3" fill="#5C3A21"/>
  <rect x="370" y="315" width="3" height="3" fill="#5C3A21"/>
  <rect x="260" y="325" width="3" height="3" fill="#5C3A21"/>
  <rect x="350" y="330" width="3" height="3" fill="#5C3A21"/>

  <!-- Plant 1: graine germee (pixel sprout) -->
  <g transform="translate(250, 305)">
    <rect x="-1" y="-6" width="2" height="6" fill="#4A8B3E"/>
    <rect x="-4" y="-8" width="3" height="3" fill="#6B9B5A"/>
    <rect x="1" y="-8" width="3" height="3" fill="#6B9B5A"/>
    <rect x="-3" y="-9" width="1" height="1" fill="#7BC579"/>
    <rect x="2" y="-9" width="1" height="1" fill="#7BC579"/>
  </g>

  <!-- Plant 2: jeune plant -->
  <g transform="translate(295, 298)">
    <rect x="-1" y="-14" width="2" height="14" fill="#4A8B3E"/>
    <rect x="-6" y="-12" width="4" height="3" fill="#6B9B5A"/>
    <rect x="2" y="-12" width="4" height="3" fill="#6B9B5A"/>
    <rect x="-5" y="-14" width="2" height="2" fill="#7BC579"/>
    <rect x="3" y="-14" width="2" height="2" fill="#7BC579"/>
    <rect x="-3" y="-16" width="6" height="3" fill="#6B9B5A"/>
    <rect x="-2" y="-18" width="4" height="2" fill="#7BC579"/>
  </g>

  <!-- Plant 3: presque mature (tomato) -->
  <g transform="translate(345, 310)">
    <rect x="-2" y="-24" width="4" height="24" fill="#4A8B3E"/>
    <rect x="-8" y="-18" width="6" height="4" fill="#6B9B5A"/>
    <rect x="2" y="-18" width="6" height="4" fill="#6B9B5A"/>
    <rect x="-7" y="-20" width="4" height="2" fill="#7BC579"/>
    <rect x="3" y="-20" width="4" height="2" fill="#7BC579"/>
    <rect x="-4" y="-26" width="8" height="4" fill="#6B9B5A"/>
    <rect x="-3" y="-28" width="6" height="2" fill="#7BC579"/>
    <!-- Tomato pixel fruit -->
    <rect x="-10" y="-14" width="4" height="4" fill="#E8623D"/>
    <rect x="-9" y="-13" width="2" height="2" fill="#FF6B47"/>
    <rect x="6" y="-16" width="4" height="4" fill="#E8623D"/>
    <rect x="7" y="-15" width="2" height="2" fill="#FF6B47"/>
  </g>

  <!-- Plant 4: mature (carrot) -->
  <g transform="translate(385, 315)">
    <rect x="-2" y="-30" width="4" height="30" fill="#4A8B3E"/>
    <rect x="-8" y="-22" width="6" height="4" fill="#6B9B5A"/>
    <rect x="2" y="-22" width="6" height="4" fill="#6B9B5A"/>
    <rect x="-7" y="-24" width="4" height="2" fill="#7BC579"/>
    <rect x="3" y="-24" width="4" height="2" fill="#7BC579"/>
    <rect x="-4" y="-32" width="8" height="4" fill="#6B9B5A"/>
    <rect x="-3" y="-34" width="6" height="2" fill="#7BC579"/>
    <!-- Carrot flowers -->
    <rect x="-6" y="-38" width="4" height="4" fill="#F5C842"/>
    <rect x="2" y="-38" width="4" height="4" fill="#F5C842"/>
    <rect x="-5" y="-39" width="2" height="2" fill="#FFD980"/>
    <rect x="3" y="-39" width="2" height="2" fill="#FFD980"/>
  </g>

  <!-- Empty slot -->
  <rect x="238" y="316" width="4" height="4" fill="#3D2810" opacity="0.6"/>

  <!-- Zone label (pixel font style) -->
  <g transform="translate(245, 370)">
    <rect width="110" height="24" fill="#2A1B0E" stroke="#5C3A21" stroke-width="1"/>
    <text x="55" y="16" text-anchor="middle" font-family="Courier, monospace" font-size="11" fill="#E5D5B8">POTAGER 4/8</text>
  </g>

  <!-- ZONE 2: JARDIN FLEURI (center) -->
  <polygon points="425,320 525,290 625,320 525,350" fill="#4A8B3E" stroke="#2D5C24" stroke-width="2"/>
  <polygon points="425,320 425,330 525,360 525,350" fill="#2D5C24"/>
  <polygon points="525,350 525,360 625,330 625,320" fill="#1F4519"/>
  <!-- Grass tufts (pixels) -->
  <rect x="465" y="308" width="2" height="4" fill="#2D5C24"/>
  <rect x="468" y="306" width="2" height="6" fill="#2D5C24"/>
  <rect x="570" y="308" width="2" height="4" fill="#2D5C24"/>
  <rect x="573" y="306" width="2" height="6" fill="#2D5C24"/>
  <rect x="600" y="312" width="2" height="4" fill="#2D5C24"/>

  <!-- Plant 1: graine germee -->
  <g transform="translate(480, 308)">
    <rect x="-1" y="-6" width="2" height="6" fill="#4A8B3E"/>
    <rect x="-4" y="-8" width="3" height="3" fill="#6B9B5A"/>
    <rect x="1" y="-8" width="3" height="3" fill="#6B9B5A"/>
  </g>

  <!-- Plant 2: BRILLIANT mature sunflower -->
  <g transform="translate(525, 300)">
    <!-- Glow halo (pixel squares) -->
    <rect x="-14" y="-44" width="28" height="28" fill="#FFD700" opacity="0.08"/>
    <rect x="-10" y="-40" width="20" height="20" fill="#FFD700" opacity="0.12"/>
    <!-- Stem -->
    <rect x="-1" y="-32" width="2" height="32" fill="#4A8B3E"/>
    <!-- Leaves -->
    <rect x="-8" y="-20" width="6" height="4" fill="#6B9B5A"/>
    <rect x="2" y="-20" width="6" height="4" fill="#6B9B5A"/>
    <rect x="-7" y="-22" width="4" height="2" fill="#7BC579"/>
    <rect x="3" y="-22" width="4" height="2" fill="#7BC579"/>
    <!-- Flower head (pixel art) -->
    <!-- Petals ring -->
    <rect x="-10" y="-42" width="4" height="4" fill="#FFD700"/>
    <rect x="6" y="-42" width="4" height="4" fill="#FFD700"/>
    <rect x="-10" y="-34" width="4" height="4" fill="#FFD700"/>
    <rect x="6" y="-34" width="4" height="4" fill="#FFD700"/>
    <rect x="-6" y="-46" width="12" height="4" fill="#FFD700"/>
    <rect x="-6" y="-30" width="12" height="4" fill="#FFD700"/>
    <rect x="-12" y="-38" width="4" height="4" fill="#FFD700"/>
    <rect x="8" y="-38" width="4" height="4" fill="#FFD700"/>
    <!-- Center -->
    <rect x="-6" y="-42" width="12" height="8" fill="#8B6914"/>
    <rect x="-4" y="-40" width="8" height="4" fill="#6B4226"/>
    <!-- Bright highlights -->
    <rect x="-10" y="-42" width="2" height="2" fill="#FFF5C2"/>
    <rect x="8" y="-42" width="2" height="2" fill="#FFF5C2"/>
    <!-- Sparkle -->
    <rect x="2" y="-50" width="2" height="2" fill="#FFFFFF" opacity="0.9"/>
    <rect x="0" y="-52" width="2" height="2" fill="#FFFFFF" opacity="0.5"/>
  </g>

  <!-- Plant 3: presque mature tulipe -->
  <g transform="translate(575, 308)">
    <rect x="-1" y="-20" width="2" height="20" fill="#4A8B3E"/>
    <rect x="-5" y="-14" width="4" height="3" fill="#6B9B5A"/>
    <rect x="1" y="-14" width="4" height="3" fill="#6B9B5A"/>
    <!-- Tulip bud (pixel) -->
    <rect x="-4" y="-26" width="8" height="6" fill="#E8623D"/>
    <rect x="-3" y="-28" width="6" height="2" fill="#FF6B47"/>
    <rect x="-2" y="-24" width="4" height="2" fill="#C44A2A"/>
  </g>

  <!-- Plant 4: mature lavande -->
  <g transform="translate(615, 312)">
    <rect x="-1" y="-22" width="2" height="22" fill="#4A8B3E"/>
    <rect x="-6" y="-16" width="5" height="3" fill="#6B9B5A"/>
    <rect x="1" y="-16" width="5" height="3" fill="#6B9B5A"/>
    <!-- Lavender stalks (pixel) -->
    <rect x="-4" y="-28" width="2" height="6" fill="#9B7BCF"/>
    <rect x="-1" y="-30" width="2" height="8" fill="#9B7BCF"/>
    <rect x="2" y="-27" width="2" height="5" fill="#9B7BCF"/>
    <rect x="-4" y="-29" width="1" height="1" fill="#C4A8E0"/>
    <rect x="-1" y="-31" width="1" height="1" fill="#C4A8E0"/>
    <rect x="2" y="-28" width="1" height="1" fill="#C4A8E0"/>
  </g>

  <!-- Zone label -->
  <g transform="translate(470, 370)">
    <rect width="120" height="24" fill="#1F4519" stroke="#2D5C24" stroke-width="1"/>
    <text x="60" y="16" text-anchor="middle" font-family="Courier, monospace" font-size="11" fill="#8BC57B">JARDIN FLEURI 4/8</text>
  </g>

  <!-- ZONE 3: VERGER (right) -->
  <polygon points="650,320 750,290 850,320 750,350" fill="#2D5C24" stroke="#1A3815" stroke-width="2"/>
  <polygon points="650,320 650,330 750,360 750,350" fill="#1A3815"/>
  <polygon points="750,350 750,360 850,330 850,320" fill="#0F280A"/>
  <rect x="690" y="308" width="2" height="4" fill="#1A3815"/>
  <rect x="693" y="306" width="2" height="6" fill="#1A3815"/>
  <rect x="810" y="310" width="2" height="4" fill="#1A3815"/>

  <!-- Plant 1: jeune plant pommier -->
  <g transform="translate(705, 308)">
    <rect x="-2" y="-14" width="4" height="14" fill="#5C3A21"/>
    <!-- Canopy (pixel circles approximated with rects) -->
    <rect x="-8" y="-22" width="16" height="10" fill="#5F9E58"/>
    <rect x="-6" y="-24" width="12" height="2" fill="#5F9E58"/>
    <rect x="-10" y="-20" width="2" height="6" fill="#5F9E58"/>
    <rect x="8" y="-20" width="2" height="6" fill="#5F9E58"/>
    <rect x="-5" y="-20" width="4" height="4" fill="#7AB068"/>
    <rect x="1" y="-22" width="4" height="4" fill="#7AB068"/>
  </g>

  <!-- Plant 2: mature pommier -->
  <g transform="translate(780, 305)">
    <!-- Trunk -->
    <rect x="-3" y="-28" width="6" height="28" fill="#5C3A21"/>
    <rect x="-2" y="-26" width="2" height="24" fill="#6B4226"/>
    <!-- Branches -->
    <rect x="-16" y="-30" width="14" height="3" fill="#5C3A21"/>
    <rect x="2" y="-26" width="14" height="3" fill="#5C3A21"/>
    <!-- Canopy (large pixel clumps) -->
    <rect x="-18" y="-46" width="36" height="20" fill="#5F9E58"/>
    <rect x="-14" y="-50" width="28" height="4" fill="#5F9E58"/>
    <rect x="-20" y="-42" width="4" height="12" fill="#5F9E58"/>
    <rect x="16" y="-42" width="4" height="12" fill="#5F9E58"/>
    <!-- Canopy highlights -->
    <rect x="-14" y="-44" width="8" height="6" fill="#7AB068"/>
    <rect x="2" y="-46" width="8" height="6" fill="#7AB068"/>
    <rect x="-6" y="-48" width="6" height="4" fill="#8BC57B"/>
    <!-- Apples (pixel) -->
    <rect x="-12" y="-38" width="4" height="4" fill="#E8623D"/>
    <rect x="-11" y="-37" width="2" height="2" fill="#FF6B47"/>
    <rect x="4" y="-42" width="4" height="4" fill="#E8623D"/>
    <rect x="5" y="-41" width="2" height="2" fill="#FF6B47"/>
    <rect x="-2" y="-36" width="3" height="3" fill="#E8623D"/>
    <rect x="-1" y="-35" width="1" height="1" fill="#FF6B47"/>
  </g>

  <!-- Empty slots -->
  <rect x="698" y="316" width="4" height="4" fill="#0F280A" opacity="0.6"/>
  <rect x="838" y="316" width="4" height="4" fill="#0F280A" opacity="0.6"/>

  <!-- Zone label -->
  <g transform="translate(695, 370)">
    <rect width="110" height="24" fill="#0F280A" stroke="#1A3815" stroke-width="1"/>
    <text x="55" y="16" text-anchor="middle" font-family="Courier, monospace" font-size="11" fill="#6BA85E">VERGER 1/3</text>
  </g>

  <!-- UI: pixel-style resource panels -->
  <g transform="translate(30, 30)">
    <rect width="200" height="44" fill="#1A1A2E" stroke="#5E3A6B" stroke-width="2"/>
    <rect x="2" y="2" width="196" height="40" fill="#0D0D1A"/>
    <rect x="8" y="14" width="4" height="16" fill="#FFD700"/>
    <rect x="16" y="18" width="8" height="8" fill="#FFF5C2"/>
    <text x="100" y="28" text-anchor="middle" font-family="Courier, monospace" font-size="14" fill="#FFF5C2">3247 PAS</text>
  </g>

  <g transform="translate(30, 425)">
    <rect width="130" height="55" fill="#1A1A2E" stroke="#4A8B3E" stroke-width="2"/>
    <rect x="2" y="2" width="126" height="51" fill="#0D1A0D"/>
    <text x="65" y="20" text-anchor="middle" font-family="Courier, monospace" font-size="11" fill="#6B9B5A">FLORINS</text>
    <text x="65" y="42" text-anchor="middle" font-family="Courier, monospace" font-size="20" fill="#FFD700" font-weight="bold">45</text>
  </g>
  <g transform="translate(175, 425)">
    <rect width="150" height="55" fill="#1A1A2E" stroke="#4A8B3E" stroke-width="2"/>
    <rect x="2" y="2" width="146" height="51" fill="#0D1A0D"/>
    <text x="75" y="20" text-anchor="middle" font-family="Courier, monospace" font-size="11" fill="#6B9B5A">RECOLTES</text>
    <text x="75" y="42" text-anchor="middle" font-family="Courier, monospace" font-size="16" fill="#E8623D">12/20 FLORINS</text>
  </g>
  <g transform="translate(340, 425)">
    <rect width="160" height="55" fill="#1A1A2E" stroke="#4A8B3E" stroke-width="2"/>
    <rect x="2" y="2" width="156" height="51" fill="#0D1A0D"/>
    <text x="80" y="20" text-anchor="middle" font-family="Courier, monospace" font-size="11" fill="#6B9B5A">ENGRAIS</text>
    <text x="80" y="42" text-anchor="middle" font-family="Courier, monospace" font-size="14" fill="#7BC579">BAS x2 · SUP x1</text>
  </g>

  <!-- Scanline overlay -->
  <rect width="900" height="550" fill="url(#scanlines)"/>

  <!-- Fireflies -->
  <rect x="150" y="200" width="2" height="2" fill="#FFF5C2" opacity="0.7"/>
  <rect x="480" y="180" width="2" height="2" fill="#FFD700" opacity="0.5"/>
  <rect x="700" y="220" width="2" height="2" fill="#FFF5C2" opacity="0.6"/>
  <rect x="350" y="240" width="2" height="2" fill="#FFD700" opacity="0.4"/>
</svg>
</body>
</html>
