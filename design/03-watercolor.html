<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>Proposition 3 — Aquarelle</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: #F5F0E8; display: flex; justify-content: center; align-items: center; min-height: 100vh; }
  svg { max-width: 100%; height: auto; }
</style>
</head>
<body>
<svg viewBox="0 0 900 550" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Watercolor paper texture -->
    <filter id="paper" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="3" seed="5"/>
      <feColorMatrix values="0 0 0 0 0.95  0 0 0 0 0.92  0 0 0 0 0.86  0 0 0 0.04 0"/>
      <feComposite in2="SourceGraphic" operator="in"/>
    </filter>
    <!-- Watercolor bleed effect -->
    <filter id="watercolor" x="-10%" y="-10%" width="120%" height="120%">
      <feTurbulence type="fractalNoise" baseFrequency="0.03" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="4"/>
      <feGaussianBlur stdDeviation="0.8"/>
    </filter>
    <filter id="watercolorHeavy" x="-10%" y="-10%" width="120%" height="120%">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="3" seed="8"/>
      <feDisplacementMap in="SourceGraphic" scale="8"/>
      <feGaussianBlur stdDeviation="1.5"/>
    </filter>
    <filter id="softShadow">
      <feGaussianBlur in="SourceAlpha" stdDeviation="2"/>
      <feOffset dx="2" dy="3"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.15"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <!-- Background wash -->
    <radialGradient id="bgWash" cx="50%" cy="40%" r="80%">
      <stop offset="0%" stop-color="#FAF6EE"/>
      <stop offset="60%" stop-color="#F0E8D8"/>
      <stop offset="100%" stop-color="#E5DBC8"/>
    </radialGradient>
    <!-- Watercolor earth -->
    <radialGradient id="wcEarth" cx="40%" cy="30%" r="80%">
      <stop offset="0%" stop-color="#A07B52" stop-opacity="0.7"/>
      <stop offset="60%" stop-color="#8B5E3C" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#6B4226" stop-opacity="0.9"/>
    </radialGradient>
    <radialGradient id="wcGrass" cx="50%" cy="30%" r="80%">
      <stop offset="0%" stop-color="#8BC57B" stop-opacity="0.7"/>
      <stop offset="60%" stop-color="#6B9B5A" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#4A8B3E" stop-opacity="0.9"/>
    </radialGradient>
    <radialGradient id="wcDeepGrass" cx="50%" cy="30%" r="80%">
      <stop offset="0%" stop-color="#6BA85E" stop-opacity="0.7"/>
      <stop offset="60%" stop-color="#4E8B42" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#2D5C24" stop-opacity="0.9"/>
    </radialGradient>
    <!-- Paint splatter -->
    <pattern id="splatter" patternUnits="userSpaceOnUse" width="60" height="60">
      <circle cx="10" cy="15" r="1.5" fill="#8B5E3C" opacity="0.15"/>
      <circle cx="35" cy="40" r="1" fill="#8B5E3C" opacity="0.1"/>
      <circle cx="50" cy="10" r="0.8" fill="#6B9B5A" opacity="0.12"/>
      <circle cx="20" cy="50" r="1.2" fill="#6B9B5A" opacity="0.1"/>
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="900" height="550" fill="url(#bgWash)"/>
  <rect width="900" height="550" fill="url(#splatter)" filter="url(#paper)"/>

  <!-- Watercolor wash background stains (decorative) -->
  <ellipse cx="200" cy="120" rx="80" ry="30" fill="#F5C842" opacity="0.06" filter="url(#watercolorHeavy)"/>
  <ellipse cx="700" cy="100" rx="100" ry="35" fill="#E8623D" opacity="0.05" filter="url(#watercolorHeavy)"/>
  <ellipse cx="450" cy="450" rx="200" ry="50" fill="#6B9B5A" opacity="0.05" filter="url(#watercolorHeavy)"/>

  <!-- Title in elegant script-style font -->
  <g transform="translate(30, 35)">
    <text font-family="Georgia, serif" font-size="22" fill="#5C4A30" font-style="italic">Aquarelle</text>
    <text x="0" y="22" font-family="Georgia, serif" font-size="13" fill="#8B7355" font-style="italic">Un jardin peint à l'aquarelle</text>
  </g>

  <!-- Step counter: watercolor tag -->
  <g transform="translate(680, 30)" filter="url(#softShadow)">
    <rect width="190" height="40" rx="20" fill="#FFF5E0" opacity="0.9"/>
    <text x="95" y="26" text-anchor="middle" font-family="Georgia, serif" font-size="14" fill="#5C4A30">3 247 pas aujourd'hui</text>
  </g>

  <!-- ZONE 1: POTAGER (left) -->
  <!-- Watercolor ground patch (organic, irregular) -->
  <g filter="url(#watercolor)">
    <path d="M 220,310 Q 230,280 280,270 Q 350,262 400,280 Q 430,290 425,310 Q 420,335 380,345 Q 320,352 270,345 Q 225,338 220,310 Z" fill="url(#wcEarth)"/>
    <!-- Side depth (soft shadow) -->
    <path d="M 220,310 Q 225,320 240,330 Q 280,345 325,348 Q 370,350 410,335 Q 420,325 425,310" fill="none" stroke="#5C3A21" stroke-width="3" opacity="0.3"/>
  </g>
  <!-- Watercolor edge bleed -->
  <path d="M 220,310 Q 230,280 280,270 Q 350,262 400,280 Q 430,290 425,310" fill="none" stroke="#8B5E3C" stroke-width="1.5" opacity="0.4" filter="url(#watercolor)"/>

  <!-- Potager plants - watercolor style -->
  <!-- Plant 1: graine germee -->
  <g transform="translate(255, 295)" filter="url(#watercolor)">
    <path d="M 0,0 Q -1,-4 -3,-6 Q -5,-7 -4,-4 Q -2,-3 0,-5 Q 2,-3 4,-4 Q 5,-7 3,-6 Q 1,-4 0,0 Z" fill="#7AB068"/>
    <line x1="0" y1="0" x2="0" y2="-5" stroke="#4A8B3E" stroke-width="1" opacity="0.6"/>
  </g>

  <!-- Plant 2: jeune plant -->
  <g transform="translate(305, 288)" filter="url(#watercolor)">
    <line x1="0" y1="0" x2="0" y2="-14" stroke="#4A8B3E" stroke-width="1.5" opacity="0.7"/>
    <ellipse cx="-5" cy="-10" rx="5" ry="4" fill="#7AB068" opacity="0.8"/>
    <ellipse cx="5" cy="-10" rx="5" ry="4" fill="#7AB068" opacity="0.8"/>
    <ellipse cx="0" cy="-14" rx="3" ry="2.5" fill="#8BC57B" opacity="0.7"/>
  </g>

  <!-- Plant 3: presque mature (tomato) -->
  <g transform="translate(355, 295)" filter="url(#watercolor)">
    <line x1="0" y1="0" x2="0" y2="-22" stroke="#4A8B3E" stroke-width="2" opacity="0.7"/>
    <ellipse cx="-7" cy="-14" rx="7" ry="5" fill="#6B9B5A" opacity="0.75"/>
    <ellipse cx="7" cy="-14" rx="7" ry="5" fill="#6B9B5A" opacity="0.75"/>
    <ellipse cx="0" cy="-22" rx="5" ry="4" fill="#7AB068" opacity="0.7"/>
    <!-- Tomato: watercolor red -->
    <circle cx="-7" cy="-10" r="3.5" fill="#E8623D" opacity="0.75"/>
    <circle cx="-7" cy="-10" r="2" fill="#FF6B47" opacity="0.5"/>
    <circle cx="5" cy="-15" r="3" fill="#E8623D" opacity="0.75"/>
    <circle cx="5" cy="-15" r="1.5" fill="#FF6B47" opacity="0.5"/>
  </g>

  <!-- Plant 4: mature (carrot) -->
  <g transform="translate(395, 300)" filter="url(#watercolor)">
    <line x1="0" y1="0" x2="0" y2="-28" stroke="#4A8B3E" stroke-width="2" opacity="0.7"/>
    <ellipse cx="-7" cy="-18" rx="7" ry="5" fill="#6B9B5A" opacity="0.75"/>
    <ellipse cx="7" cy="-18" rx="7" ry="5" fill="#6B9B5A" opacity="0.75"/>
    <ellipse cx="0" cy="-28" rx="5" ry="4" fill="#7AB068" opacity="0.7"/>
    <!-- Carrot flowers -->
    <circle cx="-3" cy="-31" r="2.5" fill="#F5C842" opacity="0.7"/>
    <circle cx="3" cy="-31" r="2.5" fill="#F5C842" opacity="0.7"/>
  </g>

  <!-- Empty slot -->
  <circle cx="240" cy="300" r="4" fill="#6B4226" opacity="0.3"/>

  <!-- Zone label (handwritten style) -->
  <g transform="translate(255, 365)">
    <text font-family="Georgia, serif" font-size="14" fill="#5C3A21" font-style="italic">Potager</text>
    <text x="0" y="16" font-family="Georgia, serif" font-size="11" fill="#8B7355" font-style="italic">4/8 emplacements</text>
  </g>

  <!-- ZONE 2: JARDIN FLEURI (center) -->
  <g filter="url(#watercolor)">
    <path d="M 445,310 Q 455,280 505,270 Q 575,262 625,280 Q 655,290 650,310 Q 645,335 605,345 Q 545,352 495,345 Q 450,338 445,310 Z" fill="url(#wcGrass)"/>
    <path d="M 445,310 Q 450,320 465,330 Q 505,345 550,348 Q 595,350 635,335 Q 645,325 650,310" fill="none" stroke="#4A8B3E" stroke-width="3" opacity="0.3"/>
  </g>
  <path d="M 445,310 Q 455,280 505,270 Q 575,262 625,280 Q 655,290 650,310" fill="none" stroke="#6B9B5A" stroke-width="1.5" opacity="0.4" filter="url(#watercolor)"/>

  <!-- Plant 1: graine germee -->
  <g transform="translate(485, 295)" filter="url(#watercolor)">
    <path d="M 0,0 Q -1,-4 -3,-6 Q -5,-7 -4,-4 Q -2,-3 0,-5 Q 2,-3 4,-4 Q 5,-7 3,-6 Q 1,-4 0,0 Z" fill="#7AB068"/>
  </g>

  <!-- Plant 2: BRILLIANT mature sunflower -->
  <g transform="translate(530, 285)">
    <!-- Watercolor glow behind -->
    <circle cx="0" cy="-38" r="16" fill="#FFF5C2" opacity="0.3" filter="url(#watercolorHeavy)"/>
    <circle cx="0" cy="-38" r="12" fill="#FFD700" opacity="0.2" filter="url(#watercolorHeavy)"/>
    <g filter="url(#watercolor)">
      <line x1="0" y1="0" x2="0" y2="-34" stroke="#4A8B3E" stroke-width="2.5" opacity="0.7"/>
      <ellipse cx="-6" cy="-18" rx="6" ry="4" fill="#6B9B5A" opacity="0.75"/>
      <ellipse cx="6" cy="-18" rx="6" ry="4" fill="#6B9B5A" opacity="0.75"/>
      <!-- Flower head -->
      <circle cx="0" cy="-38" r="7" fill="#F5C842" opacity="0.8"/>
      <circle cx="0" cy="-38" r="4" fill="#8B6914" opacity="0.7"/>
      <!-- Petals -->
      <ellipse cx="-10" cy="-38" rx="5" ry="2" fill="#F5C842" opacity="0.7"/>
      <ellipse cx="10" cy="-38" rx="5" ry="2" fill="#F5C842" opacity="0.7"/>
      <ellipse cx="0" cy="-46" rx="2" ry="5" fill="#F5C842" opacity="0.7"/>
      <ellipse cx="0" cy="-30" rx="2" ry="5" fill="#F5C842" opacity="0.7"/>
    </g>
    <!-- Brilliant sparkle (watercolor white) -->
    <path d="M 2,-46 L 3,-43 L 6,-42 L 3,-41 L 2,-38 L 1,-41 L -2,-42 L 1,-43 Z" fill="#FFFFFF" opacity="0.6" filter="url(#watercolor)"/>
  </g>

  <!-- Plant 3: presque mature tulipe -->
  <g transform="translate(580, 298)" filter="url(#watercolor)">
    <line x1="0" y1="0" x2="0" y2="-20" stroke="#4A8B3E" stroke-width="1.5" opacity="0.7"/>
    <ellipse cx="-4" cy="-12" rx="4" ry="3" fill="#6B9B5A" opacity="0.75"/>
    <ellipse cx="4" cy="-12" rx="4" ry="3" fill="#6B9B5A" opacity="0.75"/>
    <path d="M -4,-24 Q 0,-30 4,-24 L 2,-20 Q 0,-18 -2,-20 Z" fill="#E8623D" opacity="0.8"/>
  </g>

  <!-- Plant 4: mature lavande -->
  <g transform="translate(620, 300)" filter="url(#watercolor)">
    <line x1="0" y1="0" x2="0" y2="-22" stroke="#4A8B3E" stroke-width="2" opacity="0.7"/>
    <ellipse cx="-5" cy="-14" rx="5" ry="3" fill="#6B9B5A" opacity="0.75"/>
    <ellipse cx="5" cy="-14" rx="5" ry="3" fill="#6B9B5A" opacity="0.75"/>
    <rect x="-3" y="-28" width="2" height="6" rx="1" fill="#9B7BCF" opacity="0.7"/>
    <rect x="0" y="-30" width="2" height="8" rx="1" fill="#9B7BCF" opacity="0.7"/>
    <rect x="2.5" y="-27" width="2" height="5" rx="1" fill="#9B7BCF" opacity="0.7"/>
  </g>

  <!-- Zone label -->
  <g transform="translate(480, 365)">
    <text font-family="Georgia, serif" font-size="14" fill="#3D6B3A" font-style="italic">Jardin fleuri</text>
    <text x="0" y="16" font-family="Georgia, serif" font-size="11" fill="#5A8B4E" font-style="italic">4/8 emplacements</text>
  </g>

  <!-- ZONE 3: VERGER (right) -->
  <g filter="url(#watercolor)">
    <path d="M 670,310 Q 680,280 730,270 Q 800,262 850,280 Q 880,290 875,310 Q 870,335 830,345 Q 770,352 720,345 Q 675,338 670,310 Z" fill="url(#wcDeepGrass)"/>
    <path d="M 670,310 Q 675,320 690,330 Q 730,345 775,348 Q 820,350 860,335 Q 870,325 875,310" fill="none" stroke="#2D5C24" stroke-width="3" opacity="0.3"/>
  </g>
  <path d="M 670,310 Q 680,280 730,270 Q 800,262 850,280 Q 880,290 875,310" fill="none" stroke="#4E8B42" stroke-width="1.5" opacity="0.4" filter="url(#watercolor)"/>

  <!-- Plant 1: jeune plant pommier -->
  <g transform="translate(725, 295)" filter="url(#watercolor)">
    <line x1="0" y1="0" x2="0" y2="-14" stroke="#5C3A21" stroke-width="3" opacity="0.7"/>
    <circle cx="0" cy="-18" r="9" fill="#5F9E58" opacity="0.75"/>
    <circle cx="-3" cy="-21" r="4" fill="#7AB068" opacity="0.7"/>
    <circle cx="4" cy="-16" r="4" fill="#7AB068" opacity="0.7"/>
  </g>

  <!-- Plant 2: mature pommier -->
  <g transform="translate(795, 290)" filter="url(#watercolor)">
    <rect x="-3" y="-28" width="6" height="30" fill="#5C3A21" opacity="0.7"/>
    <line x1="-2" y1="-23" x2="-15" y2="-30" stroke="#5C3A21" stroke-width="2" opacity="0.7"/>
    <line x1="2" y1="-20" x2="14" y2="-26" stroke="#5C3A21" stroke-width="2" opacity="0.7"/>
    <circle cx="0" cy="-38" r="17" fill="#5F9E58" opacity="0.75"/>
    <circle cx="-8" cy="-42" r="9" fill="#7AB068" opacity="0.7"/>
    <circle cx="8" cy="-36" r="9" fill="#7AB068" opacity="0.7"/>
    <circle cx="0" cy="-46" r="7" fill="#8BC57B" opacity="0.65"/>
    <!-- Apples -->
    <circle cx="-10" cy="-36" r="3" fill="#E8623D" opacity="0.8"/>
    <circle cx="6" cy="-44" r="3" fill="#E8623D" opacity="0.8"/>
    <circle cx="3" cy="-32" r="2.5" fill="#E8623D" opacity="0.8"/>
  </g>

  <!-- Empty slots -->
  <circle cx="700" cy="300" r="4" fill="#2D5C24" opacity="0.3"/>
  <circle cx="850" cy="300" r="4" fill="#2D5C24" opacity="0.3"/>

  <!-- Zone label -->
  <g transform="translate(710, 365)">
    <text font-family="Georgia, serif" font-size="14" fill="#2D5C24" font-style="italic">Verger</text>
    <text x="0" y="16" font-family="Georgia, serif" font-size="11" fill="#4E8B42" font-style="italic">1/3 emplacements</text>
  </g>

  <!-- UI: watercolor resource cards -->
  <g transform="translate(30, 425)" filter="url(#softShadow)">
    <rect width="130" height="55" rx="8" fill="#FFF5E0" opacity="0.85"/>
    <text x="65" y="20" text-anchor="middle" font-family="Georgia, serif" font-size="12" fill="#8B7355" font-style="italic">Florins</text>
    <text x="65" y="42" text-anchor="middle" font-family="Georgia, serif" font-size="20" fill="#5C4A30" font-weight="bold">45</text>
  </g>
  <g transform="translate(175, 425)" filter="url(#softShadow)">
    <rect width="150" height="55" rx="8" fill="#FFF5E0" opacity="0.85"/>
    <text x="75" y="20" text-anchor="middle" font-family="Georgia, serif" font-size="12" fill="#8B7355" font-style="italic">Récoltes du jour</text>
    <text x="75" y="42" text-anchor="middle" font-family="Georgia, serif" font-size="15" fill="#5C4A30">12 / 20 florins</text>
  </g>
  <g transform="translate(340, 425)" filter="url(#softShadow)">
    <rect width="160" height="55" rx="8" fill="#FFF5E0" opacity="0.85"/>
    <text x="80" y="20" text-anchor="middle" font-family="Georgia, serif" font-size="12" fill="#8B7355" font-style="italic">Engrais</text>
    <text x="80" y="42" text-anchor="middle" font-family="Georgia, serif" font-size="14" fill="#5C4A30">Basique x2 · Super x1</text>
  </g>

  <!-- Decorative watercolor stain bottom -->
  <ellipse cx="450" cy="510" rx="300" ry="20" fill="#6B9B5A" opacity="0.06" filter="url(#watercolorHeavy)"/>
</svg>
</body>
</html>
